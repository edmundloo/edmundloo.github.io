    /* Radix Sand: step 1 background, step 12 text */
    :root {
      --color-bg: #fdfdfc;
      --color-text: #21201c;
      --font-serif: "Cinzel", serif;
      --tracking: 0.3em;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #111110;
        --color-text: #eeeeec;
      }
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-serif);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    h1 {
      margin: 0;
      /* The extra leading inset balances the letter-spacing after the last letter */
      padding-inline: calc(1rem + var(--tracking)) 1rem;
      font-size: 0.875rem;
      font-weight: 400;
      letter-spacing: var(--tracking);
      text-align: center;
    }

    .short {
      display: none;
    }

    /* Too narrow for NON INVENTUM in a row */
    @media (width <= 13em) {
      .full {
        display: none;
      }

      .short {
        display: inline;
      }
    }

    /* Too narrow for 404 in a row: stack the digits when the screen is tall enough */
    @media (width <= 4.75em) and (height >= 6.875em) {
      h1 {
        writing-mode: vertical-lr;
        text-orientation: upright;
      }
    }

    /* Too narrow and too short to stack */
    @media (width <= 4.75em) and (height < 6.875em) {
      h1 {
        padding: 0;
        letter-spacing: 0;
      }
    }
