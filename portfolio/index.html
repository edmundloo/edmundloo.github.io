    /* Radix Sand: step 1 background, steps 12 and 11 text, step 7 underline, step 8 focus ring */
    :root {
      --color-bg: #fdfdfc;
      --color-text: #21201c;
      --color-text-hover: #63635e;
      --color-line: #cfceca;
      --color-focus: #bcbbb5;
      --font-serif: "Cinzel", serif;
      --font-sans: "Inter", sans-serif;
      --tracking: 0.3em;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #111110;
        --color-text: #eeeeec;
        --color-text-hover: #b5b3ad;
        --color-line: #494844;
        --color-focus: #62605b;
      }
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-serif);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    main {
      padding: 2rem 1rem;
      text-align: center;
    }

    h1 {
      margin: 0 0 2rem;
      /* Balances the letter-spacing after the last letter */
      padding-left: var(--tracking);
      font-size: 0.875rem;
      font-weight: 400;
      letter-spacing: var(--tracking);
    }

    ul {
      margin: 0;
      padding: 0;
      list-style: none;
      font-family: var(--font-sans);
      font-size: 0.875rem;
      line-height: 2;
    }

    a {
      color: inherit;
      text-decoration-color: var(--color-line);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      transition: color 0.3s, text-decoration-color 0.3s;
    }

    a:focus-visible {
      color: var(--color-text-hover);
      text-decoration-color: transparent;
      outline: 1px solid var(--color-focus);
      outline-offset: 2px;
    }

    /* Touch screens keep :hover after a tap, so only pointing devices get the hover style */
    @media (hover: hover) {
      a:hover {
        color: var(--color-text-hover);
        text-decoration-color: transparent;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      a {
        transition: none;
      }
    }

    @media (width <= 10em) {
      main {
        padding-inline: 0;
      }

      h1 {
        padding-left: 0;
        letter-spacing: 0;
      }
    }

    /* Too narrow for PORTFOLIO in a row: each row shows only its first letter */
    @media (width <= 5.25em) {
      .rest {
        display: none;
      }

      a {
        text-transform: uppercase;
      }
    }
  </style>
