<!DOCTYPE html>
<html lang="en-US">

<head>
  <!-- Character encoding, viewport, and color scheme -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#fdfdfc" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)" />

  <!-- Primary Meta Tags -->
  <title>Edmund Loo</title>
  <link rel="canonical" href="https://edmundloo.com/" />

  <!-- Security -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:;" />

  <!-- No icon: an empty data: URL stops browsers requesting /favicon.ico -->
  <link rel="icon" href="data:," />

  <!-- Fonts: text= must list every character the page displays -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel&text=AD%20MAIOREM%20DEI%20GLORIAM&display=block"
    rel="stylesheet" />

  <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />

  <style>
    /* Radix Sand: step 1 background, step 12 text */
    :root {
      --color-bg: #fdfdfc;
      --color-text: #21201c;
      --font-serif: "Cinzel", serif;
      --tracking: 0.3em;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #111110;
        --color-text: #eeeeec;
      }
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-serif);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    h1 {
      margin: 0;
      /* The extra leading inset balances the letter-spacing after the last letter */
      padding: 0 1rem 0 calc(1rem + var(--tracking));
      font-size: 0.875rem;
      font-weight: 400;
      letter-spacing: var(--tracking);
      text-align: center;
      text-wrap: balance;
    }

    .short {
      display: none;
    }

    /* Too narrow for two lines: the traditional abbreviation */
    @media (width <= 11.25em) {
      .full {
        display: none;
      }

      .short {
        display: inline;
      }
    }

    /* Too narrow for AMDG in a row: stack the letters when the screen is tall enough */
    @media (width <= 6.25em) and (height >= 8em) {
      h1 {
        padding: calc(1rem + var(--tracking)) 0 1rem;
        writing-mode: vertical-lr;
        text-orientation: upright;
      }
    }

    /* Too narrow and too short to stack */
    @media (width <= 6.25em) and (height < 8em) {
      h1 {
        padding: 0;
        letter-spacing: 0;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1><span class="full">AD MAIOREM DEI GLORIAM</span> <span class="short">AMDG</span></h1>
  </main>
</body>

</html>
