<head>
  <meta charset="UTF-8" />

  <meta http-equiv="refresh" content="0; url=/Edmund_Loo_Resume.pdf" />
  <link rel="canonical" href="https://edmundloo.com/Edmund_Loo_Resume.pdf" />

  <title>Redirecting…</title>
  <style>
    /* Radix Sand: step 1 background, step 12 text, step 7 underline */
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background-color: #fdfdfc;
      color: #21201c;
      font: 0.875rem serif;
    }

    /* Hidden during a normal hop; appears only if the refresh is blocked */
    a {
      padding-left: 0.3em;
      color: inherit;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      text-decoration-color: #cfceca;
      text-underline-offset: 3px;
      opacity: 0;
      animation: reveal 0.3s ease 3s forwards;
    }

    @keyframes reveal {
      to {
        opacity: 1;
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #111110;
        color: #eeeeec;
      }

      a {
        text-decoration-color: #494844;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      a {
        animation-duration: 0s;
      }
    }
  </style>
</head>
